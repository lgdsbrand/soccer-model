name: Keep backend awake

# Render's free tier sleeps the backend after ~15 minutes of no traffic, which
# also kills the in-process hourly data-refresh scheduler until someone wakes
# it back up. Pinging /health every 10 minutes keeps it running continuously
# so the scheduler actually fires on its intended cadence.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sf https://soccer-model.onrender.com/health || echo "Ping failed (backend may be waking up or down)"
